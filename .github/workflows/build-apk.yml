name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - run: flutter create --platforms=android --project-name trading_mastery .
      - run: flutter pub get
      - name: Repair build-only Dart syntax and numeric types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          fixes = [
              ("  ]);\n}\n\nclass ChecklistPage", "  ]));\n}\n\nclass ChecklistPage"),
              ("  ]); }\n}\n\nclass GlossaryPage", "  ])); }\n}\n\nclass GlossaryPage"),
              ("children: items.map((e) => Card(child: Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(e.key, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.amber)), const SizedBox(height: 5), Text(e.value, style: const TextStyle(color: Colors.white70, height: 1.45))])))).toList());", "children: items.map((e) => Card(child: Padding(padding: const EdgeInsets.all(16), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(e.key, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.amber)), const SizedBox(height: 5), Text(e.value, style: const TextStyle(color: Colors.white70, height: 1.45))]))))).toList());"),
              ("  ]);\n}\n\nclass TradingVisual", "  ]));\n}\n\nclass TradingVisual"),
              ("  void candle(Canvas c, Size s) {", "  void _candle(Canvas c, Size s) {"),
              ("final x=(i%2==0)?24:s.width*.53;", "final x=(i%2==0)?24.0:s.width*.53;"),
              ("Text(lesson.subtitle,style:const TextStyle(color:Colors.white70,fontSize:14,height:1.4))])); }", "Text(lesson.subtitle,style:const TextStyle(color:Colors.white70,fontSize:14,height:1.4))]))); }"),
              ("final xs = [45.0, 85, 125, 165, 205, 245, 285, 325];", "final List<double> xs = [45.0, 85.0, 125.0, 165.0, 205.0, 245.0, 285.0, 325.0];"),
          ]
          for old, new in fixes:
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: trading-mastery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
