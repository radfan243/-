name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - run: flutter create --platforms=android --project-name trading_mastery .
      - run: flutter pub get
      - name: Repair build-only Dart syntax and numeric types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          fixes = [
              ("  ]);\n}\n\nclass ChecklistPage", "  ]));\n}\n\nclass ChecklistPage"),
              ("  ]); }\n}\n\nclass GlossaryPage", "  ])); }\n}\n\nclass GlossaryPage"),
              ("  ]);\n}\n\nclass TradingVisual", "  ]));\n}\n\nclass TradingVisual"),
              ("  void candle(Canvas c, Size s) {", "  void _candle(Canvas c, Size s) {"),
              ("final x=(i%2==0)?24:s.width*.53;", "final x=(i%2==0)?24.0:s.width*.53;"),
              ("Text(lesson.subtitle,style:const TextStyle(color:Colors.white70,fontSize:14,height:1.4))])); }", "Text(lesson.subtitle,style:const TextStyle(color:Colors.white70,fontSize:14,height:1.4))]))); }"),
              ("final xs = [45.0, 85, 125, 165, 205, 245, 285, 325];", "final List<double> xs = [45.0, 85.0, 125.0, 165.0, 205.0, 245.0, 285.0, 325.0];"),
          ]
          for old, new in fixes:
              s = s.replace(old, new)

          # Rebuild only the glossary page's build expression in the runner workspace.
          glossary = re.compile(r"  Widget build\(BuildContext context\) => Scaffold\(appBar: AppBar\(title: const Text\('قاموس التداول'\)\), body: ListView\(.*?\)\);\n", re.S)
          glossary_replacement = """  Widget build(BuildContext context) => Scaffold(\n    appBar: AppBar(title: const Text('قاموس التداول')),\n    body: ListView(\n      padding: const EdgeInsets.all(18),\n      children: items.map((e) => Card(\n        child: Padding(\n          padding: const EdgeInsets.all(16),\n          child: Column(\n            crossAxisAlignment: CrossAxisAlignment.start,\n            children: [\n              Text(e.key, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.amber)),\n              const SizedBox(height: 5),\n              Text(e.value, style: const TextStyle(color: Colors.white70, height: 1.45)),\n            ],\n          ),\n        ),\n      )).toList(),\n    ),\n  );\n"""
          s, count = glossary.subn(glossary_replacement, s, count=1)
          if count != 1:
              raise SystemExit('Glossary build expression was not found')

          # Fix only named arguments inside line(...) calls; do not touch other Dart assignments.
          s = re.sub(r'(?m)(line\([^\n]*?),color=', r'\1,color:', s)
          s = re.sub(r'(?m)(line\([^\n]*?),width=', r'\1,width:', s)
          s = s.replace('final x=(i%2==0)?24:s.width*.53;', 'final x=(i%2==0)?24.0:s.width*.53;')
          p.write_text(s, encoding='utf-8')
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: trading-mastery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
