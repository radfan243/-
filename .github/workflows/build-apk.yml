name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - run: flutter create --platforms=android --project-name trading_mastery .
      - run: flutter pub get
      - name: Fix Dart numeric types before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          old = "final xs = [45.0, 85, 125, 165, 205, 245, 285, 325];"
          new = "final List<double> xs = [45.0, 85.0, 125.0, 165.0, 205.0, 245.0, 285.0, 325.0];"
          if old not in s:
              raise SystemExit('Expected candle x-coordinate line was not found.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: trading-mastery-apk
          path: build/app/outputs/flutter-apk/app-release.apk
